[project]
name = "jobpilot-backend"
version = "0.1.0"
description = "FastAPI backend for the JobPilot MVP"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.6",
  "SQLAlchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "python-multipart>=0.0.9",
  "openpyxl>=3.1",
  "pypdf>=5.0",
  "python-docx>=1.1",
  "openai>=1.50",
  "pgvector>=0.3",
  "PyJWT[crypto]>=2.10",
  "httpx>=0.27",
  "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
